<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Managed Firewall Dashboard – Credential Setup</title>
<style>body{font:14px/1.5 Helvetica,Arial,sans-serif;background:#f4f6fa;color:#0f172a;margin:0;display:flex;justify-content:center;padding:32px 16px}
.c{max-width:560px;width:100%;background:#fff;border:1px solid #d5dbe5;border-radius:14px;padding:24px;box-shadow:0 8px 24px -12px rgba(15,23,42,.3)}
h1{font:700 20px Montserrat,Helvetica,sans-serif;color:#A63C06;margin:0 0 6px}label{display:block;margin:12px 0 4px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #b6c0cf;border-radius:8px;font:inherit}
button{margin-top:16px;padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:600 14px inherit;cursor:pointer}
textarea{width:100%;height:150px;box-sizing:border-box;margin-top:12px;font:12px monospace;border:1px solid #b6c0cf;border-radius:8px;padding:8px}
.n{color:#475569;font-size:12.5px}.w{color:#991b1b;font-size:12.5px}</style></head><body><div class="c">
<h1>Credential setup</h1>
<p class="n">Runs entirely in this browser tab; nothing is uploaded. It creates <b>auth.config.js</b>, which holds only a salted hash. Save it next to the dashboard HTML. <b>Never commit auth.config.js to GitHub.</b></p>
<label for="u">Username</label><input id="u" autocomplete="off">
<label for="p">New password (10+ characters, longer is better)</label><input id="p" type="password" autocomplete="new-password">
<label for="p2">Repeat password</label><input id="p2" type="password" autocomplete="new-password">
<button id="go" type="button">Generate auth.config.js</button>
<p id="m" class="w" role="status"></p>
<textarea id="out" readonly hidden></textarea><button id="dl" type="button" hidden>Download auth.config.js</button>
</div>
<script>
const AUTH_ROUNDS=150000;let AUTH_SALT="";
const sha256=(()=>{const K=new Uint32Array(64),r=(x,n)=>x>>>n|x<<32-n;let p=2,c=0;
  while(c<64){let pr=1;for(let i=2;i*i<=p;i++)if(p%i===0){pr=0;break}if(pr){K[c++]=Math.floor((Math.pow(p,1/3)%1)*4294967296)>>>0}p++}
  const I=[];p=2;c=0;while(c<8){let pr=1;for(let i=2;i*i<=p;i++)if(p%i===0){pr=0;break}if(pr){I[c++]=Math.floor((Math.pow(p,.5)%1)*4294967296)>>>0}p++}
  return m=>{const l=m.length,n=(l+9+63>>6)<<6,b=new Uint8Array(n);b.set(m);b[l]=128;const dv=new DataView(b.buffer);dv.setUint32(n-4,l*8>>>0);dv.setUint32(n-8,Math.floor(l/536870912));
    const h=Uint32Array.from(I),w=new Uint32Array(64);
    for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
      for(let i=16;i<64;i++){const a=w[i-15],d=w[i-2];w[i]=(w[i-16]+(r(a,7)^r(a,18)^a>>>3)+w[i-7]+(r(d,17)^r(d,19)^d>>>10))>>>0}
      let[a,b2,c2,d,e,f,g,hh]=h;
      for(let i=0;i<64;i++){const t1=(hh+(r(e,6)^r(e,11)^r(e,25))+(e&f^~e&g)+K[i]+w[i])>>>0,t2=((r(a,2)^r(a,13)^r(a,22))+(a&b2^a&c2^b2&c2))>>>0;hh=g;g=f;f=e;e=d+t1>>>0;d=c2;c2=b2;b2=a;a=t1+t2>>>0}
      h[0]+=a;h[1]+=b2;h[2]+=c2;h[3]+=d;h[4]+=e;h[5]+=f;h[6]+=g;h[7]+=hh}
    const out=new Uint8Array(32),ov=new DataView(out.buffer);for(let i=0;i<8;i++)ov.setUint32(i*4,h[i]>>>0);return out}})();
const enc=s=>new TextEncoder().encode(s),hex=u=>[...u].map(x=>x.toString(16).padStart(2,"0")).join("");
const unhex=s=>Uint8Array.from(s.match(/../g).map(x=>parseInt(x,16)));
function derive(user,pw){const salt=unhex(AUTH_SALT);let h=sha256(enc(AUTH_SALT+"|"+user+"|"+pw));
  for(let i=0;i<AUTH_ROUNDS;i++){const m=new Uint8Array(h.length+salt.length);m.set(h);m.set(salt,h.length);h=sha256(m)}return hex(h)}

function derive(user,pw){const salt=unhex(AUTH_SALT);let h=sha256(enc(AUTH_SALT+"|"+user+"|"+pw));
  for(let i=0;i<AUTH_ROUNDS;i++){const m=new Uint8Array(h.length+salt.length);m.set(h);m.set(salt,h.length);h=sha256(m)}return hex(h)}
const $=i=>document.getElementById(i);
$("go").onclick=()=>{
  const u=$("u").value,p=$("p").value,m=$("m");m.textContent="";
  if(!u||p.length<10){m.textContent="Enter a username and a password of at least 10 characters.";return}
  if(p!==$("p2").value){m.textContent="The passwords do not match.";return}
  AUTH_SALT=hex(crypto.getRandomValues(new Uint8Array(16)));
  m.textContent="Working …";setTimeout(()=>{
    const cfg="/* PRIVATE - generated by Credential Setup. Do NOT commit to GitHub. */\nwindow.MFW_AUTH={salt:\""+AUTH_SALT+"\",hash:\""+derive(u,p)+"\",rounds:"+AUTH_ROUNDS+"};\n";
    $("out").value=cfg;$("out").hidden=false;$("dl").hidden=false;m.textContent="";$("p").value=$("p2").value="";
    window.__cfg=cfg;
  },30)};
$("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([window.__cfg],{type:"text/javascript"}));a.download="auth.config.js";document.body.append(a);a.click();a.remove()};
</script></body></html>
